# MI MÚSICA — Gradle properties
org.gradle.parallel=true

# AndroidX (requerido para Compose y AndroidX libraries)
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin/AGP: Kotlin integrado en AGP 9.x habilitado por defecto
android.builtInKotlin=true
android.newDsl=true
# KSP añade fuentes generadas via kotlin.sourceSets; con built-in Kotlin se debe
# desactivar esa restricción (mensaje oficial de AGP, ver built-in-kotlin doc).
android.disallowKotlinSourceSets=false

# Compilador de Kotlin más agresivo en caché de recursos
kotlin.code.style=official

# Configuración de la Máquina Virtual oficial del daemon de Gradle será el JetBrains Runtime
# de Android Studio (la ruta se detalla en ARCHITECTURE.md §22.4)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
