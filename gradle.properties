# MI MÚSICA — Gradle properties
org.gradle.parallel=true

# AndroidX (requerido para Compose y AndroidX libraries)
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin/AGP: Kotlin integrado en AGP 9.x habilitado por defecto
android.builtInKotlin=true
android.newDsl=true

# Compilador de Kotlin más agresivo en caché de recursos
kotlin.code.style=official

# Configuración de la Máquina Virtual oficial del daemon de Gradle será el JetBrains Runtime
# de Android Studio (la ruta se detalla en ARCHITECTURE.md §22.4)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
